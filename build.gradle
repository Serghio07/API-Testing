// gradle cucumberCli -Psuite="@Regression"
tasks.register('cucumberCli', JavaExec) {
    group = 'verification'
    description = 'Ejecuta los escenarios Cucumber por tags'

    dependsOn tasks.named('testClasses')

    mainClass.set('io.cucumber.core.cli.Main')
    classpath = sourceSets.test.runtimeClasspath

    def suite = providers.gradleProperty('suite').getOrElse('@Regression')

    args(
            '--plugin', 'pretty',
            '--plugin', 'html:report/cucumber-report.html',
            '--glue', 'runner',
            '--tags', suite,
            'src/test/resources'
    )
}
